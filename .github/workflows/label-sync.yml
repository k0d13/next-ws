name: Label Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/labels.yml]

jobs:
  sync:
    name: Label Sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@v6.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
