colors: false
output:
  - failure

pre-commit:
  commands:
    lint:
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'
      run: pnpm exec oxlint --deny-warnings {staged_files}
    format:
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,json5,yaml,yml,toml,md,mdx}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
